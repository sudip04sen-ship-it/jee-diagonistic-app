<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Diagnostic Configuration Terminal</title>
    <style>
        body {
            background-color: #0b0b14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 30px;
            margin: 0;
        }
        .config-container {
            background: linear-gradient(145deg, #131324, #1b1b32);
            border: 1px solid #2e2e4e;
            border-radius: 12px;
            max-width: 650px;
            margin: 0 auto; 
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 { margin-top: 0; color: #00d2d3; border-bottom: 1px solid #2e2e4e; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #a4b0be; }
        select, input[type="number"] {
            width: 100%; background: #0b0b14; border: 1px solid #444; color: white; 
            padding: 10px; border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        .btn-launch {
            background: linear-gradient(135deg, #00d2d3, #4d00ff); color: white; border: none;
            padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: bold; 
            cursor: pointer; width: 100%; transition: opacity 0.2s;
        }
        .btn-launch:hover { opacity: 0.9; }
        .quiz-engine-view { display: none; background: #131324; padding: 20px; border-radius: 8px; border: 1px solid #2e2e4e; }
        .question-card { background: #0b0b14; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #4d00ff; }
        .timer-banner { font-size: 18px; font-weight: bold; color: #ff4757; text-align: right; margin-bottom: 15px; font-family: monospace; }
        
        .quiz-text-input {
            width: 100%; background: #131324; border: 1px solid #444; color: #fff;
            padding: 10px; border-radius: 4px; font-size: 14px; margin-top: 10px; box-sizing: border-box;
        }
        .quiz-text-input:disabled {
            background: #1b1b32;
            color: #747d8c;
            border-color: #2e2e4e;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="config-container">
    <div id="setup-panel">
        <h2 id="subject-title">JEE Target Configuration Panel</h2>
        
        <div class="form-group">
            <label for="chapter-select">Select Target Chapter:</label>
            <select id="chapter-select"></select>
        </div>

        <div class="form-group">
            <label for="difficulty-select">Select Parameter Difficulty:</label>
            <select id="difficulty-select">
                <option value="easy">Easy (Conceptual Recall)</option>
                <option value="medium">Medium (Application Matrix)</option>
                <option value="tough">Tough (Advanced Multi-Concept)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="count-input">Number of Questions (Max 10):</label>
            <input type="number" id="count-input" value="5" min="1" max="10">
        </div>

        <div class="form-group">
            <label for="time-select">Session Allocation Time:</label>
            <select id="time-select">
                <option value="5">5 Minutes</option>
                <option value="10">10 Minutes</option>
                <option value="20">20 Minutes</option>
                <option value="30">30 Minutes</option>
            </select>
        </div>

        <button class="btn-launch" onclick="generateCustomQuizSession()">Initialize Core Blueprint ⚡</button>
    </div>

    <div id="quiz-terminal" class="quiz-engine-view">
        <div id="quiz-clock" class="timer-banner">Time Remaining: --:--</div>
        <div id="questions-go-here"></div>
        <div id="quiz-action-zone" style="margin-top: 20px;">
            <button class="btn-launch" style="background: linear-gradient(135deg, #2ed573, #1e90ff);" onclick="submitQuizSession()">
                Submit Assignment Matrix 🚀
            </button>
        </div>
    </div>
</div>

// =====================================================================
// 🎲 RANDOMIZER ENGINE (Kept completely functional)
// =====================================================================
function getRandomQuizQuestions(subject, topic, difficulty, count = 3) {
    try {
        if (!QUESTION_BANK[subject] || !QUESTION_BANK[subject][topic] || !QUESTION_BANK[subject][topic][difficulty]) {
            console.error("Target path inside question bank array is broken.");
            return [];
        }
        let pool = [...QUESTION_BANK[subject][topic][difficulty]];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool.slice(0, count);
    } catch (err) {
        console.error("Critical error inside the randomization workflow:", err);
        return [];
    }
}

let activeSubject = "math";
let activeTimer = null;
let secondsLeft = 0;
let currentSessionQuestions = []; 

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const sub = urlParams.get('subject');
    if (sub && QUESTION_BANK[sub]) {
        activeSubject = sub;
    }
    
    document.getElementById("subject-title").innerText = `JEE ${activeSubject.toUpperCase()} Exam Panel`;
    
    const chapSelect = document.getElementById("chapter-select");
    if (chapSelect) {
        chapSelect.innerHTML = ""; 
        Object.keys(QUESTION_BANK[activeSubject]).forEach(chap => {
            let opt = document.createElement("option");
            opt.value = chap;
            opt.innerText = chap.charAt(0).toUpperCase() + chap.slice(1);
            chapSelect.appendChild(opt);
        });
    }
};

// =====================================================================
// 🚀 UPDATED GENERATOR: RENDERS MULTIPLE-CHOICE OPTIONS
// =====================================================================
function generateCustomQuizSession() {
    const chapterSelect = document.getElementById("chapter-select");
    const difficultySelect = document.getElementById("difficulty-select");
    const countInput = document.getElementById("count-input");
    const timeSelect = document.getElementById("time-select");
    
    const outputContainer = document.getElementById("questions-go-here");
    const setupPanel = document.getElementById("setup-panel");
    const quizTerminal = document.getElementById("quiz-terminal");

    const chapter = chapterSelect.value;
    const difficulty = difficultySelect.value;
    let count = parseInt(countInput.value, 10) || 5;
    if (count > 10) count = 10; 

    if (!QUESTION_BANK[activeSubject] || !QUESTION_BANK[activeSubject][chapter] || !QUESTION_BANK[activeSubject][chapter][difficulty]) {
        outputContainer.innerHTML = `<p style="color: #ff4757; font-weight: bold;">⚠️ No matching profile records located in repository setup bank.</p>`;
        return;
    }

    currentSessionQuestions = getRandomQuizQuestions(activeSubject, chapter, difficulty, count);

    if (currentSessionQuestions.length === 0) {
        outputContainer.innerHTML = `<p style="color: #ff4757; font-weight: bold;">⚠️ Failed to load questions from the bank.</p>`;
        return;
    }

    // Clear output area
    outputContainer.innerHTML = "";

    // Generate dynamic MCQ HTML template structure loops
    currentSessionQuestions.forEach((item, index) => {
        const questionBlock = document.createElement("div");
        questionBlock.className = "quiz-question-wrapper";
        questionBlock.style.marginBottom = "25px";
        questionBlock.style.background = "rgba(255, 255, 255, 0.05)";
        questionBlock.style.padding = "15px";
        questionBlock.style.borderRadius = "8px";

        // Build Title Question Layout
        let htmlContent = `<p style="font-weight: 600; margin-bottom: 12px; color: #fff;">Q${index + 1}: ${item.q}</p>`;
        
        // Build the Radio Inputs List
        htmlContent += `<div class="options-group-container" style="display: flex; flex-direction: column; gap: 8px;">`;
        item.options.forEach((opt) => {
            htmlContent += `
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px; border-radius: 4px; color: #ced6e0;">
                    <input type="radio" name="mcq-group-${index}" value="${opt}" id="ans-input-${index}-${opt.replace(/\s+/g, '')}" style="accent-color: #1e90ff;">
                    ${opt}
                </label>
            `;
        });
        htmlContent += `</div>`;
        
        // Setup individual validation target row placeholders
        htmlContent += `<div id="feedback-${index}" class="feedback-node" style="margin-top: 10px; font-weight: bold; display: none;"></div>`;
        
        questionBlock.innerHTML = htmlContent;
        outputContainer.appendChild(questionBlock);
    });

    // Start Timer Systems
    const minutesAllocated = parseInt(timeSelect.value, 10) || 5;
    secondsLeft = minutesAllocated * 60;
    
    if (activeTimer) clearInterval(activeTimer);
    
    activeTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
            clearInterval(activeTimer);
            document.getElementById("quiz-clock").innerText = "Time Remaining: 00:00";
            submitQuizSession();
        } else {
            let mins = Math.floor(secondsLeft / 60);
            let secs = secondsLeft % 60;
            document.getElementById("quiz-clock").innerText = `Time Remaining: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
    }, 1000);

    // Swap Viewports panels
    setupPanel.style.display = "none";
    quizTerminal.style.display = "block";
}

// =====================================================================
// 🎯 UPDATED EVALUATION ENGINE: CAPTURES SELECTED MCQs
// =====================================================================
function submitQuizSession() {
    clearInterval(activeTimer);
    let score = 0;

    currentSessionQuestions.forEach((item, index) => {
        const feedback = document.getElementById(`feedback-${index}`);
        
        // Find the checked option inside our custom named radio group
        const selectedRadio = document.querySelector(`input[name="mcq-group-${index}"]:checked`);
        
        // Disable all radio buttons inside this question block group to freeze changes
        const radiosInGroup = document.querySelectorAll(`input[name="mcq-group-${index}"]`);
        radiosInGroup.forEach(radio => radio.disabled = true);

        if (feedback) {
            feedback.style.display = "block";
            
            // Extract selected text if exist, otherwise treat empty
            let cleanUserAns = selectedRadio ? selectedRadio.value.trim().toLowerCase() : "";
            let cleanCorrectAns = item.a.trim().toLowerCase();

            if (cleanUserAns === cleanCorrectAns) {
                feedback.innerText = `✅ Correct! (+50 XP)`;
                feedback.style.color = "#2ed573";
                score += 50;
            } else {
                feedback.innerText = `❌ Incorrect. Correct Answer: ${item.a}`;
                feedback.style.color = "#ff4757";
            }
        }
    });

    // Wire up the calculated points back into your Global Leaderboard state
    if (score > 0 && typeof window.addXpReward === "function") {
        window.addXpReward(score);
    } else if (score > 0) {
        let currentLocalXP = parseInt(localStorage.getItem("totalUserXP") || "0", 10);
        localStorage.setItem("totalUserXP", currentLocalXP + score);
    }

    const actionZone = document.getElementById("quiz-action-zone");
    if (actionZone) {
        actionZone.innerHTML = `
            <p style="font-weight: bold; color: #00d2d3;">Session Complete! Total Points Gained: +${score} XP</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-launch" style="background: #ff4757; flex: 1;" onclick="window.location.reload()">
                    Take Another Quiz 🔄
                </button>
                <button class="btn-launch" style="background: linear-gradient(135deg, #1e90ff, #4d00ff); flex: 1;" onclick="window.location.href='index.html'">
                    Return to Study Deck 📑
                </button>
            </div>
        `;
    }
}
